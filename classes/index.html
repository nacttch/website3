<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Classes | Tejas Tango</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --tango-gold: #d4af37; }
        body { font-family: 'Montserrat', sans-serif; background-color: #050505; color: #ffffff; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .text-gold { color: var(--tango-gold); }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <nav class="fixed w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center h-20">
            <a href="/" class="text-2xl font-bold text-gold">TEJAS <span class="text-white">TANGO</span></a>
            <div class="hidden md:flex space-x-8 text-sm uppercase tracking-widest">
                <a href="/" class="hover:text-gold transition">Home</a>
                <a href="/classes/" class="text-gold">Classes</a>
                <a href="/events/" class="hover:text-gold transition">Events</a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 max-w-7xl mx-auto px-6">
        <h1 class="text-5xl font-bold mb-12 text-center">Dance <span class="text-gold">Programs</span></h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <div class="bg-zinc-900 p-8 rounded-2xl border border-white/5 hover:border-gold/50 transition">
                <div class="text-gold text-4xl mb-4"><i class="fa-solid fa-seedling"></i></div>
                <h2 class="text-2xl font-bold mb-4">Beginner</h2>
                <p class="text-gray-400 mb-6">Master the basic connection and walk.</p>
                <button class="w-full py-2 border border-gold text-gold rounded-lg hover:bg-gold hover:text-black transition">Sign Up</button>
            </div>
            <div class="bg-zinc-900 p-8 rounded-2xl border border-white/5 hover:border-gold/50 transition">
                <div class="text-gold text-4xl mb-4"><i class="fa-solid fa-star"></i></div>
                <h2 class="text-2xl font-bold mb-4">Intermediate</h2>
                <p class="text-gray-400 mb-6">Giros, Sacadas, and Musicality.</p>
                <button class="w-full py-2 border border-gold text-gold rounded-lg hover:bg-gold hover:text-black transition">Sign Up</button>
            </div>
            <div class="bg-zinc-900 p-8 rounded-2xl border border-white/5 hover:border-gold/50 transition">
                <div class="text-gold text-4xl mb-4"><i class="fa-solid fa-crown"></i></div>
                <h2 class="text-2xl font-bold mb-4">Masterclass</h2>
                <p class="text-gray-400 mb-6">Refining style and artistry.</p>
                <button class="w-full py-2 border border-gold text-gold rounded-lg hover:bg-gold hover:text-black transition">Sign Up</button>
            </div>
        </div>
    </main>

    <footer class="py-12 bg-black border-t border-white/5 text-center mt-auto text-gray-500">
        <p>© 2026 Tejas Tango. All Rights Reserved.</p>
    </footer>
</body>
</html>
