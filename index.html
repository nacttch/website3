<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tejas Tango | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --tango-gold: #d4af37; }
        body { font-family: 'Montserrat', sans-serif; background-color: #050505; color: #ffffff; }
        h1 { font-family: 'Playfair Display', serif; }
        .hero-bg { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=1920&q=80'); background-size: cover; }
        .text-gold { color: var(--tango-gold); }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <nav class="fixed w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center h-20">
            <a href="/" class="text-2xl font-bold text-gold">TEJAS <span class="text-white">TANGO</span></a>
            <div class="hidden md:flex space-x-8 text-sm uppercase tracking-widest">
                <a href="/" class="text-gold">Home</a>
                <a href="/classes/" class="hover:text-gold transition">Classes</a>
                <a href="/events/" class="hover:text-gold transition">Events</a>
            </div>
        </div>
    </nav>

    <section class="h-screen flex items-center justify-center text-center hero-bg">
        <div class="max-w-4xl px-6">
            <h1 class="text-6xl md:text-8xl font-black mb-6">Passion in every <span class="text-gold italic">Step.</span></h1>
            <p class="text-xl text-gray-300 mb-10">Experience authentic Argentine Tango.</p>
            <div class="flex flex-col md:flex-row justify-center gap-6">
                <a href="/classes/" class="bg-[#d4af37] text-black px-10 py-4 rounded-full font-bold uppercase">View Classes</a>
            </div>
        </div>
    </section>

    <footer class="py-12 bg-black border-t border-white/5 text-center text-gray-500">
        <p>© 2026 Tejas Tango. All Rights Reserved.</p>
    </footer>
</body>
</html>
